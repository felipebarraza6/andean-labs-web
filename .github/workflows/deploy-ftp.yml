name: Deploy FTP (producción)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
      FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL }}
      SITE_URL: ${{ vars.SITE_URL || 'https://andeanlabs.cl' }}
    steps:
      - name: Verificar secretos
        id: check
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::notice::Faltan secretos FTP_SERVER/FTP_USERNAME/FTP_PASSWORD; se omite el deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'

      - name: Armar dist/ (URLs absolutas al dominio final)
        if: steps.check.outputs.ok == 'true'
        run: |
          mkdir dist
          cp -r index.html assets data i18n dist/
          find dist -name '*.html' -exec sed -i "s#https://felipebarraza6.github.io/andean-labs-web#${SITE_URL%/}#g" {} +
          grep -rn "github.io" dist --include=*.html && exit 1 || true

      - name: Deploy por FTP
        if: steps.check.outputs.ok == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          protocol: ${{ env.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./dist/
          server-dir: ${{ env.FTP_SERVER_DIR || 'public_html/' }}
