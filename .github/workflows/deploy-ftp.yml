name: Deploy FTP (producción)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar secretos
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::error::Faltan secretos FTP_SERVER, FTP_USERNAME o FTP_PASSWORD."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Armar dist/ (solo el sitio)
        env:
          SITE_URL: https://andeanlabs.cl
        run: |
          mkdir dist
          cp -r index.html assets data i18n dist/
          find dist -name '*.html' -exec sed -i "s#https://felipebarraza6.github.io/andean-labs-web#${SITE_URL}#g" {} +
          if grep -rn "github.io" dist --include='*.html'; then
            echo "::error::Quedaron URLs de GitHub Pages en dist/"
            exit 1
          fi

      - name: Deploy por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
            **/scripts/**
            **/README.md
            **/package.json
            **/package-lock.json
            **/_old_wp/**
            **/_old_wp/**/*
            **/.well-known/**
            **/.well-known/**/*
            **/cgi-bin/**
            **/cgi-bin/**/*
