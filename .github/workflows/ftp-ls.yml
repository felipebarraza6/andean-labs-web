name: ftp-ls
on:
  push:
    branches: [ci/ftp-deploy]
jobs:
  ls:
    runs-on: ubuntu-latest
    steps:
      - name: diag
        env: {S: "${{ secrets.FTP_SERVER }}", U: "${{ secrets.FTP_USERNAME }}", P: "${{ secrets.FTP_PASSWORD }}"}
        run: |
          getent hosts "$S" | awk '{print "IP:",$1}' | sed 's/\./ . /g'
          for p in 21 990 22; do timeout 8 bash -c "echo > /dev/tcp/$S/$p" && echo "port $p OPEN" || echo "port $p CLOSED"; done
          echo "== FTPS explicit =="; curl -sS --max-time 30 --ssl-reqd -k --list-only -u "$U:$P" "ftp://$S/" 2>&1 | sed 's/^/ROOT: /' || true
          curl -sS --max-time 30 --ssl-reqd -k --list-only -u "$U:$P" "ftp://$S/public_html/" 2>&1 | head -40 | sed 's/^/PH: /' || true
          echo "== PLAIN =="; curl -sS --max-time 30 --list-only -u "$U:$P" "ftp://$S/" 2>&1 | sed 's/^/ROOTPLAIN: /' || true
